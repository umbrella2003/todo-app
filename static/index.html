<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>待办清单</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h1 { text-align: center; }
        .input-row { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 10px 16px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; background: #4CAF50; color: white; }
        button:hover { background: #45a049; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #eee; }
        .text { flex: 1; }
        .done { text-decoration: line-through; color: #999; }
        .date { font-size: 13px; color: #666; }
        .date.overdue { color: #f44336; font-weight: bold; }
        .btn-toggle { background: #2196F3; }
        .btn-delete { background: #f44336; }
        .auth-box { background: #f5f5f5; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .auth-box input { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .auth-box button { width: 100%; margin-bottom: 8px; }
        .error { color: #f44336; font-size: 14px; margin-top: 8px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logout { background: #999; padding: 6px 12px; font-size: 14px; }
        .hidden { display: none; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-btn { background: #eee; color: #333; padding: 6px 14px; font-size: 14px; }
        .filter-btn.active { background: #4CAF50; color: white; }
        .category-tag { font-size: 12px; background: #e3f2fd; color: #1976D2; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- 登录/注册区域 -->
    <div id="auth" class="auth-box">
        <h2 id="auth-title">登录</h2>
        <input id="username" placeholder="用户名" />
        <input id="password" type="password" placeholder="密码" />
        <button onclick="submitAuth()" id="auth-btn">登录</button>
        <button onclick="toggleAuthMode()" style="background:#666;" id="switch-btn">没有账号？去注册</button>
        <div id="auth-error" class="error"></div>
    </div>

    <!-- 待办区域（登录后才显示） -->
    <div id="app" class="hidden">
        <div class="top-bar">
            <span>👤 <span id="current-user"></span></span>
            <button class="logout" onclick="logout()">退出登录</button>
        </div>
        <h1>📋 我的待办</h1>
        <div style="margin-bottom:12px;">
            <input id="search" placeholder="🔍 搜索待办..." style="width:100%; box-sizing:border-box;" />
        </div>
        <div class="input-row">
            <input id="input" placeholder="输入新待办，回车添加..." />
            <input id="due-date" type="date" style="flex:0 0 150px;" />
            <select id="category" style="flex:0 0 100px; padding:10px; border:1px solid #ccc; border-radius:6px;">
                <option value="工作">工作</option>
                <option value="学习">学习</option>
                <option value="生活">生活</option>
                <option value="其他" selected>其他</option>
            </select>
            <button onclick="addTodo()">添加</button>
        </div>
        <div class="filter-row">
            <button class="filter-btn active" onclick="filterBy('全部')">全部</button>
            <button class="filter-btn" onclick="filterBy('工作')">工作</button>
            <button class="filter-btn" onclick="filterBy('学习')">学习</button>
            <button class="filter-btn" onclick="filterBy('生活')">生活</button>
            <button class="filter-btn" onclick="filterBy('其他')">其他</button>
        </div>
        <ul id="list"></ul>
    </div>

    <script>
        const API = "";
        let isLoginMode = true;
        let token = localStorage.getItem("token") || "";
        let currentFilter = "全部";
        let currentKeyword = "";

        //#新增函数
        function filterBy(cat) {
            currentFilter = cat;
            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.classList.toggle("active", btn.textContent === cat);
            });
            loadTodos();
        }

        // ===== 认证相关 =====

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("auth-title").textContent = isLoginMode ? "登录" : "注册";
            document.getElementById("auth-btn").textContent = isLoginMode ? "登录" : "注册";
            document.getElementById("switch-btn").textContent = isLoginMode ? "没有账号？去注册" : "已有账号？去登录";
            document.getElementById("auth-error").textContent = "";
        }

        async function submitAuth() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errEl = document.getElementById("auth-error");
            errEl.textContent = "";

            if (!username || !password) {
                errEl.textContent = "用户名和密码不能为空";
                return;
            }

            const url = isLoginMode ? "/login" : "/register";
            try {
                const res = await fetch(API + url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    errEl.textContent = data.detail || "出错了";
                    return;
                }
                if (isLoginMode) {
                    token = data.access_token;
                    localStorage.setItem("token", token);
                    localStorage.setItem("username", username);
                    enterApp();
                } else {
                    errEl.style.color = "#4CAF50";
                    errEl.textContent = "注册成功！请登录";
                    isLoginMode = true;
                    document.getElementById("auth-title").textContent = "登录";
                    document.getElementById("auth-btn").textContent = "登录";
                    document.getElementById("switch-btn").textContent = "没有账号？去注册";
                }
            } catch (e) {
                errEl.textContent = "网络错误: " + e.message;
            }
        }

        function logout() {
            token = "";
            localStorage.removeItem("token");
            localStorage.removeItem("username");
            location.reload();
        }

        function enterApp() {
            document.getElementById("auth").classList.add("hidden");
            document.getElementById("app").classList.remove("hidden");
            document.getElementById("current-user").textContent = localStorage.getItem("username") || "";
            loadTodos();
        }

        // ===== 待办相关 =====

        function authHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            };
        }

            async function loadTodos() {
            const params = new URLSearchParams();
            if (currentFilter !== "全部") params.set("category", currentFilter);
            if (currentKeyword) params.set("keyword", currentKeyword);

            const url = `${API}/todos${params.toString() ? '?' + params.toString() : ''}`;
            const res = await fetch(url, { headers: authHeaders() });

            if (res.status === 401) { logout(); return; }
            const todos = await res.json();
            const list = document.getElementById("list");
            list.innerHTML = "";
            todos.forEach(t => {
                const li = document.createElement("li");
                let dateHtml = "";
                if (t.due_date) {
                    const today = new Date().toISOString().slice(0, 10);
                    const overdue = !t.done && t.due_date < today;
                    const cls = overdue ? "date overdue" : "date";
                    dateHtml = `<span class="${cls}">📅 ${t.due_date}</span>`;
                }
                li.innerHTML = `
                    <span class="text ${t.done ? 'done' : ''}">${t.text}</span>
                    <span class="category-tag">${t.category || '其他'}</span>
                    ${dateHtml}
                    <button class="btn-toggle" onclick="toggleTodo(${t.id})">✓</button>
                    <button class="btn-delete" onclick="deleteTodo(${t.id})">✗</button>
                `;
                list.appendChild(li);
            });
        }

        async function addTodo() {
            const input = document.getElementById("input");
            const dateInput = document.getElementById("due-date");
            const catSelect = document.getElementById("category");
            const text = input.value.trim();
            if (!text) return;

            const body = { text, category: catSelect.value };
            if (dateInput.value) body.due_date = dateInput.value;

            await fetch(API + "/todos", {
                method: "POST",
                headers: authHeaders(),
                body: JSON.stringify(body)
            });
            input.value = "";
            dateInput.value = "";
            loadTodos();
        }

        async function toggleTodo(id) {
            await fetch(API + `/todos/${id}`, {
                method: "PATCH",
                headers: authHeaders()
            });
            loadTodos();
        }

        async function deleteTodo(id) {
            await fetch(API + `/todos/${id}`, {
                method: "DELETE",
                headers: authHeaders()
            });
            loadTodos();
        }

        document.getElementById("input").addEventListener("keypress", e => {
            if (e.key === "Enter") addTodo();
        });
        document.getElementById("search").addEventListener("input", e => {
            currentKeyword = e.target.value.trim();
            loadTodos();
        });

        // ===== 启动 =====

        if (token) {
            enterApp();
        }
        // 否则显示登录框（默认就是显示的，不用管）
    </script>
</body>
</html>
